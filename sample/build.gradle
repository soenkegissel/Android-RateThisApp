apply plugin: "com.android.application"

android {
    compileSdk 37

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 37
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            applicationIdSuffix = ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    flavorDimensions = ["vendor"]

    // If you need to add more flavors, consider using flavor dimensions.
    productFlavors {
        AMAZONSTORE {
            dimension "vendor"
            applicationIdSuffix ".amazon"
            versionNameSuffix '.amazon'
            buildConfigField "String", "MARKET", "\"AMAZON\""
        }
        GOOGLE {
            dimension "vendor"
            isDefault = true
            buildConfigField "String", "MARKET", "\"GOOGLE\""
        }
        HUAWEI {
            dimension "vendor"
            applicationIdSuffix ".huawei"
            versionNameSuffix '.huawei'
            buildConfigField "String", "MARKET", "\"HUAWEI\""
        }
        SAMSUNG {
            dimension "vendor"
            applicationIdSuffix ".samsung"
            versionNameSuffix '.samsung'
            buildConfigField "String", "MARKET", "\"SAMSUNG\""
        }
    }

    namespace 'com.kobakei.ratethisapp.sample'

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':ratethisapp')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
}
