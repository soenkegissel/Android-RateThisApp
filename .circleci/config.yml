version: 2.1
jobs:
  build:
    docker:
      - image: cimg/android:2026.10.1
    environment:
      GRADLE_OPTS: '-Dorg.gradle.daemon=false'
    steps:
      - checkout
      - restore_cache:
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum "ratethisapp/build.gradle" }}-{{ checksum "sample/build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - run:
          name: Build
          command: ./gradlew build
      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-{{ checksum "build.gradle" }}-{{ checksum "ratethisapp/build.gradle" }}-{{ checksum "sample/build.gradle" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      - store_test_results:
          path: ratethisapp/build/test-results
      - store_artifacts:
          path: sample/build/outputs
          destination: outputs
workflows:
  build:
    jobs:
      - build
